name: Incoming rules (apply 00/01/02 on every push)

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One live run per ref; a superseded push is cancelled to save runners.
concurrency:
  group: incoming-rules-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  rules:
    name: incoming rules (00/01/02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: architecture rules
        run: |
          set +e
          python3 tools/incoming/incoming_rules.py \
              --upload src/ \
              --check-architecture > arch.json
          echo "exit_arch=$?"
        continue-on-error: true

      - name: implementation rules
        run: |
          set +e
          python3 tools/incoming/incoming_rules.py \
              --upload src/ \
              --check-implementation > impl.json
          echo "exit_impl=$?"
        continue-on-error: true

      - name: changelog rules
        run: |
          set +e
          python3 tools/incoming/incoming_rules.py \
              --upload src/ \
              --check-changelog > changelog.json
          echo "exit_chl=$?"
        continue-on-error: true

      # Publish every verdict as a GitHub Actions annotation so the PR
      # view shows the offending file, the rule, and the message inline.
      # The python script is a one-liner to keep YAML block literals
      # straightforward (no inner quotes or `<<` tokens).
      - name: publish annotations
        if: always()
        run: |
          for f in arch.json impl.json changelog.json; do
            if [ ! -s "$f" ]; then continue; fi
            python3 -c 'import json, pathlib, sys
          p = pathlib.Path("'"$f"'")
          try:
              verdicts = json.loads(p.read_text())
          except json.JSONDecodeError:
              print("::warning::" + str(p) + " is not valid JSON")
              sys.exit(0)
          for v in verdicts:
              sev = "error" if v.get("severity") == "error" else "warning"
              file = v.get("file", "?").replace("%", "%25")
              rule = v.get("rule", "?")
              msg = v.get("message", "?").replace("%", "%25").replace(chr(10), " ")
              print("::" + sev + " file=" + file + "::" + rule + ": " + msg)'
          done

      # The job is a FAIL if any rule produced at least one error verdict.
      # We avoid YAML's merge-key interpretation by putting the python
      # script in a separate file via `python3 -c` (single-quoted,
      # no heredoc) so the YAML parser never sees `<<`.
      - name: summarise
        if: always()
        run: |
          python3 -c 'import json, pathlib, sys
          bad = 0
          for name in ("arch.json", "impl.json", "changelog.json"):
              p = pathlib.Path(name)
              if not p.exists() or p.stat().st_size == 0:
                  continue
              try:
                  verdicts = json.loads(p.read_text())
              except Exception:
                  continue
              if any(v.get("severity") == "error" for v in verdicts):
                  bad += 1
          if bad > 0:
              print(f"incoming-rules: {bad} rule set(s) reported violations.")
              sys.exit(1)
          print("incoming-rules: clean.")'

