name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  structure:
    name: ledgers + repository rules (no compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: inventory ledgers are current (INV-1)
        run: python3 tools/inventory/ejlive_inventory.py --check
      - name: service activation ledger is current
        run: python3 tools/inventory/service_activation.py --check
      - name: static gate (38 rules)
        run: python3 tools/gates/ejlive_static_gate.py --verbose

  build:
    name: build + tests + probes + packaging (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: restore
        run: dotnet restore EJLive.Platform.slnx --configfile NuGet.Config
      - name: build (serialised: parallel node reuse races shared generated sources)
        run: dotnet build EJLive.Platform.slnx -c Release -m:1 /p:BuildInParallel=false --nologo
      - name: tests
        run: dotnet test src/EJLive.Tests/EJLive.Tests.csproj -c Release --no-build --nologo
      - name: verification probes
        run: dotnet run --project src/EJLive.Verification/EJLive.Verification.csproj -c Release --no-build
      - name: package payloads
        run: cmd /c tools\package\package.bat Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ejlive-payloads
          path: tools/package/dist/*.zip
          if-no-files-found: warn
